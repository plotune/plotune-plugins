name: Bug report
description: A plugin installs wrongly, a skill misbehaves, or an update does not arrive.
labels: [bug]
body:
  - type: dropdown
    id: plugin
    attributes:
      label: Plugin
      options: [plotune-requirements, plotune-nexus, plotune-stream, marketplace / tooling]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Plugin version
      description: From `claude plugin list`, `codex plugin list` or the README table.
    validations:
      required: true
  - type: dropdown
    id: tool
    attributes:
      label: Tool
      options: [Claude Code, Codex, GitHub Copilot CLI, Cursor, OpenCode, Other]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands you ran. Please remove tokens, device UUIDs and private URLs.
  - type: markdown
    attributes:
      value: "Security problems: do **not** file them here. See SECURITY.md."
