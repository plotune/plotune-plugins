name: release

# When a plugin's version on main has no tag yet, tag it `<plugin>--v<version>` and publish a
# GitHub Release whose notes are that version's CHANGELOG.md section. The tag is also what
# OpenCode users pin to (see README). Idempotent: already-tagged versions are skipped.
# Runs only on main, and re-runs the consistency checks first (branch protection is not
# available on this plan, so direct pushes to main are not blocked by the PR checks).

on:
  push:
    branches: [main]
    paths:
      - "plugins/**"
  workflow_dispatch:

permissions:
  contents: write # create tags and releases

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Only ever tag commits on main (a manual run on another branch must not create tags).
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # need existing tags
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # A direct push to main skips pull-request CI, so re-check consistency before tagging.
      - name: Verify before releasing
        run: |
          set -euo pipefail
          python tools/check_manifests.py
          python tools/check_skills.py
          python tools/check_evals.py
          python tools/sync_opencode.py --check
          python -I -m unittest discover -s tools/tests
      - name: Create missing tags and releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python tools/release_plan.py > "$RUNNER_TEMP/plan.jsonl"
          if [ ! -s "$RUNNER_TEMP/plan.jsonl" ]; then
            echo "Nothing to release."
            exit 0
          fi
          while IFS= read -r line; do
            tag=$(jq -r .tag <<<"$line")
            title=$(jq -r .title <<<"$line")
            jq -r .notes <<<"$line" > "$RUNNER_TEMP/notes.md"
            echo "Releasing $tag"
            gh release create "$tag" --target "$GITHUB_SHA" --title "$title" --notes-file "$RUNNER_TEMP/notes.md"
          done < "$RUNNER_TEMP/plan.jsonl"
