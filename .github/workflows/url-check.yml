name: url-check

# Liveness check for the MCP server URLs plugins ship (e.g. https://stream.plotune.net/mcp).
# A 404/410 or an unreachable host fails; 401/403/405/5xx count as alive (auth is expected).
# Runs weekly because an endpoint can disappear without any change in this repo.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "plugins/*/.mcp.json"
      - "plugins/*/mcp.json"
      - "plugins/*/mcp/*.json"
      - "tools/check_mcp_urls.py"

permissions:
  contents: read

jobs:
  urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - run: python tools/check_mcp_urls.py
