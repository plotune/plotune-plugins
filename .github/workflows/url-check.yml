name: url-check

# Liveness check for the MCP server URLs plugins ship (e.g. https://stream.plotune.net/mcp).
# A 404/410 or an unreachable host fails; 401/403/405/5xx count as alive (auth is expected).
# Runs weekly because an endpoint can disappear without any change in this repo.

on:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:
  pull_request:
    paths:
      - "plugins/*/.mcp.json"
      - "plugins/*/mcp.json"
      - "plugins/*/mcp/*.json"
      - "tools/check_mcp_urls.py"

permissions:
  contents: read

jobs:
  urls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - run: python tools/check_mcp_urls.py
