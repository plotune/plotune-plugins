name: validate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0 # the version-bump check compares against the base branch
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Manifests, catalogs and README agree
        run: python tools/check_manifests.py
      - name: Skill frontmatter
        run: python tools/check_skills.py
      - name: Eval suites are well-formed
        run: python tools/check_evals.py
      - name: MCP URLs are well-formed (live check runs in url-check.yml)
        run: python tools/check_mcp_urls.py --offline
      - name: OpenCode entry points are in sync with the template
        run: python tools/sync_opencode.py --check
      - name: Changed plugins have a higher version
        if: github.event_name == 'pull_request'
        run: python tools/check_version_bumps.py --base "origin/${{ github.base_ref }}"

      - name: Tool tests (Python)
        run: python -I -m unittest discover -s tools/tests
      - name: Tool tests (OpenCode adapter)
        run: node --test tools/tests/opencode-adapter.test.mjs
      - name: plotune-requirements tests
        run: python -I -m unittest discover -s tests
        working-directory: plugins/plotune-requirements
      - name: plotune-nexus tests
        run: python -I -m unittest discover -s tests
        working-directory: plugins/plotune-nexus

      # Advisory until the CLI install is confirmed to be stable in CI.
      - name: claude plugin validate
        continue-on-error: true
        run: |
          npm i -g @anthropic-ai/claude-code
          claude plugin validate .
